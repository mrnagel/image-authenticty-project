services:
  trufor:
    build: 
      context: ../models/trufor
      dockerfile: Dockerfile
    image: trufor
    volumes:
      - ./model_outputs:/model_outputs
      - ./saved_photo:/saved_photo
  
  bfree:
    build: 
      context: ../models/bfree
      dockerfile: Dockerfile
    image: bfree
    volumes:
      - ./model_outputs:/model_outputs
      - ./saved_photo:/saved_photo
  
  dda:
    build: 
      context: ../models/dda
      dockerfile: Dockerfile
    image: dda
    volumes:
      - ./model_outputs:/model_outputs
      - ./saved_photo:/saved_photo

  visualizer:
    build: 
      context: ../models/visualizer
      dockerfile: Dockerfile
    image: visualizer
    volumes:
      - ./saved_photo:/saved_photo
      - ./model_outputs/visualizer:/model_outputs/visualizer
      - ./model_outputs/trufor/:/model_outputs/trufor/